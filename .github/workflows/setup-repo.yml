name: setup-repo option regression

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-setup-repo-options:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
    - name: Check shell syntax
      run: |
        sh -n install.sh
        sh -n scripts/test-setup-repo.sh
    - name: Check setup-repo options (offline only)
      run: |
        sh scripts/test-setup-repo.sh
        TEST_SHELL=bash sh scripts/test-setup-repo.sh
